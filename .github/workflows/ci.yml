name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On macOS, where tend runs: dev/test.sh drives the binary with real Git and
  # Grove and stand-ins for herdr, rex, gh and curl.
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Grove
        run: |
          curl -fsSL https://raw.githubusercontent.com/mascah/grove/main/install.sh | sh -s -- v0.13.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: dev/test.sh
      - run: brew install shellcheck && shellcheck install.sh
